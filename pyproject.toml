[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flaggr"
dynamic = ["version"]
description = "Python SDK for Flaggr, the OpenFeature-compatible feature flag platform"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Flaggr", email = "hello@flaggr.dev" }]
keywords = ["feature-flags", "feature-toggles", "openfeature", "flaggr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.16,<0.17",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://flaggr.dev"
Documentation = "https://github.com/flaggr-dev/flaggr-python#readme"
Repository = "https://github.com/flaggr-dev/flaggr-python"
Issues = "https://github.com/flaggr-dev/flaggr-python/issues"
Changelog = "https://github.com/flaggr-dev/flaggr-python/releases"

[tool.hatch.version]
path = "flaggr/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["flaggr"]

[tool.hatch.build.targets.sdist]
include = ["/flaggr", "/tests", "/README.md", "/LICENSE"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.pyupgrade]
# Annotations stay evaluable on Python 3.9 (typing.get_type_hints).
keep-runtime-typing = true

[tool.mypy]
strict = true
files = ["flaggr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
